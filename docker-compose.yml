services:

  # ========================================================
  # PRODUCT DATABASE
  # ========================================================

  product-db:
    image: postgres:18
    container_name: product-db

    environment:
      POSTGRES_DB: product_db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - product-db-data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d product_db"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - microservices-network


  # ========================================================
  # ORDER DATABASE
  # ========================================================

  order-db:
    image: postgres:18
    container_name: order-db

    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - order-db-data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d order_db"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - microservices-network


  # ========================================================
  # PAYMENT DATABASE
  # ========================================================

  payment-db:
    image: postgres:18
    container_name: payment-db

    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - payment-db-data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d payment_db"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - microservices-network


  # ========================================================
  # KAFKA
  # ========================================================

  kafka:
    image: apache/kafka:latest
    container_name: kafka

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

    networks:
      - microservices-network


  # ========================================================
  # PRODUCT SERVICE
  # ========================================================

  product-service:
    build:
      context: ./product-service

    container_name: product-service

    ports:
      - "8081:8081"

    environment:
      SERVER_PORT: 8081

      DB_URL: jdbc:postgresql://product-db:5432/product_db
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

    depends_on:
      product-db:
        condition: service_healthy

    networks:
      - microservices-network


  # ========================================================
  # ORDER SERVICE
  # ========================================================

  order-service:
    build:
      context: ./order-service

    container_name: order-service

    ports:
      - "8080:8080"

    environment:
      SERVER_PORT: 8080

      DB_URL: jdbc:postgresql://order-db:5432/order_db
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      PRODUCT_SERVICE_URL: http://product-service:8081
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

    depends_on:
      order-db:
        condition: service_healthy

      product-service:
        condition: service_started

      kafka:
        condition: service_started

    networks:
      - microservices-network


  # ========================================================
  # PAYMENT SERVICE
  # ========================================================

  payment-service:
    build:
      context: ./payment-service

    container_name: payment-service

    ports:
      - "8082:8082"

    environment:
      SERVER_PORT: 8082

      DB_URL: jdbc:postgresql://payment-db:5432/payment_db
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

    depends_on:
      payment-db:
        condition: service_healthy

      kafka:
        condition: service_started

    networks:
      - microservices-network


  # ========================================================
  # API GATEWAY
  # ========================================================

  api-gateway:
    build:
      context: ./api-gateway

    container_name: api-gateway

    ports:
      - "8085:8085"

    environment:
      SERVER_PORT: 8085

      PRODUCT_SERVICE_URL: http://product-service:8081
      ORDER_SERVICE_URL: http://order-service:8080

    depends_on:
      product-service:
        condition: service_started

      order-service:
        condition: service_started

    networks:
      - microservices-network


  # ========================================================
  # FRONTEND
  # ========================================================

  frontend:
    build:
      context: ./frontend

    container_name: frontend

    ports:
      - "3000:80"

    depends_on:
      api-gateway:
        condition: service_started

    networks:
      - microservices-network


# ==========================================================
# VOLUMES
# ==========================================================

volumes:
  product-db-data:
  order-db-data:
  payment-db-data:


# ==========================================================
# NETWORK
# ==========================================================

networks:
  microservices-network:
    driver: bridge