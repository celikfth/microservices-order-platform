spring.application.name=api-gateway

server.port=${SERVER_PORT:8085}


# =========================================================
# PRODUCT SERVICE ROUTE
# =========================================================

spring.cloud.gateway.server.webflux.routes[0].id=product-service
spring.cloud.gateway.server.webflux.routes[0].uri=${PRODUCT_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/products/**


# =========================================================
# ORDER SERVICE ROUTE
# =========================================================

spring.cloud.gateway.server.webflux.routes[1].id=order-service
spring.cloud.gateway.server.webflux.routes[1].uri=${ORDER_SERVICE_URL:http://localhost:8080}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/orders/**


# =========================================================
# ACTUATOR
# =========================================================

management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.gateway.access=read-only
management.endpoint.health.show-details=always