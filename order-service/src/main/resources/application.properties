spring.application.name=order-service

# =========================================================
# SERVER
# =========================================================

server.port=${SERVER_PORT:8082}


# =========================================================
# DATABASE
# =========================================================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/order_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}


# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# =========================================================
# PRODUCT SERVICE
# =========================================================

product.service.url=${PRODUCT_SERVICE_URL:http://localhost:8081}


# =========================================================
# RESILIENCE4J - RETRY
# =========================================================

resilience4j.retry.instances.productService.max-attempts=3
resilience4j.retry.instances.productService.wait-duration=1s


# =========================================================
# RESILIENCE4J - CIRCUIT BREAKER
# =========================================================

resilience4j.circuitbreaker.instances.productService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.productService.sliding-window-size=5
resilience4j.circuitbreaker.instances.productService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.productService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.productService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.productService.permitted-number-of-calls-in-half-open-state=2

resilience4j.circuitbreaker.instances.productService.record-exceptions=com.fatih.microservices.order.exception.ProductServiceUnavailableException

resilience4j.circuitbreaker.instances.productService.register-health-indicator=true


# =========================================================
# KAFKA
# =========================================================

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Consumer
spring.kafka.consumer.group-id=order-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer


# =========================================================
# ACTUATOR
# =========================================================

management.endpoint.health.show-details=always
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers,circuitbreakerevents